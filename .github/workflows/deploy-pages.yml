name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'adapters/**'
      - 'registry/**'
      - 'data/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Builds from committed data — no network calls, so a deploy can never be
      # blocked by a third-party feed being down.
      - name: Build
        env:
          # Set to a repository subpath ("/defi-dna/") for a project page,
          # or "./" for relative paths when serving from IPFS.
          DEFI_DNA_BASE: ${{ vars.DEFI_DNA_BASE || '/' }}
        run: |
          if [ -f data/index.json ]; then npm run bundle; fi
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
