server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Mounted at run time: never cached, or a new data URL would not take effect.
  location = /config.json {
    add_header Cache-Control "no-store";
  }

  # The image carries no data; this only applies when a folder is mounted here
  # instead of reading the data repository.
  location /data/ {
    add_header Cache-Control "no-cache";
  }

  # Hashed filenames: safe to keep forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The app uses hash routing, so this only has to serve the one page.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
