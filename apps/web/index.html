<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>defidna — what every risk feed says about a DeFi protocol</title>
    <meta
      name="description"
      content="Neutral aggregator of DeFi risk feeds. Every feed's verdict shown verbatim, side by side, with sources and dates. No composite score."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#16161f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- Self-hosted Umami: page views only, no cookies. One page, hash routes: it follows the hash changes itself. -->
    <script
      defer
      src="https://umami.defidna.io/script.js"
      data-website-id="a85f8cca-19f9-483c-8657-d9042366a904"
    ></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Set the theme before first paint so a dark-theme reader never sees a white flash.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('defi-dna-theme') === 'light' ? 'light' : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
