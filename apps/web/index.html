<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>defi-dna — what every risk feed says about a DeFi protocol</title>
    <meta
      name="description"
      content="Neutral aggregator of DeFi risk feeds. Every feed's verdict shown verbatim, side by side, with sources and dates. No composite score."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#16161f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2316161f'/%3E%3Cpath d='M6 22V10h4M14 10v12M22 10v12h4' stroke='%2328e5e5' stroke-width='2.5' fill='none' stroke-linecap='square'/%3E%3C/svg%3E"
    />
    <script>
      // Set the theme before first paint so a dark-theme reader never sees a white flash.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('defi-dna-theme') === 'light' ? 'light' : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
